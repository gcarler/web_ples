<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#05c7f2" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#049DD9" stroke-width="2" stroke-opacity="0.8" />

  <!-- Geodetic / Radar subtle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />

  <!-- PLES lowercase 'p' in Comfortaa geometry -->
  <!-- Stem -->
  <rect x="14" y="14" width="9" height="36" rx="4.5" fill="#f8fafc" />

  <!-- Bowl -->
  <circle cx="34" cy="24" r="13" fill="none" stroke="#f8fafc" stroke-width="7" />

  <!-- Iconic PLES radar sonar dot -->
  <circle cx="34" cy="24" r="4.5" fill="url(#dotGlow)" />
  <circle cx="34" cy="24" r="7.5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7" />
</svg>
